<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="icon" type="image/png" href="../assets/images/logo.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/alerta.js"></script>
    <script src="../js/sessao.js"></script>
</head>
<body>

    <div class="janela">
        <div class="header-left">
            <img src="../assets/images/logo.png" alt="Logo SketchStyle" class="logo">
            
            <div class="navegacao">
                <a href="../dashboard/dashboard.html" class="agora">
                    <h3>Dashboard</h3>
                </a>
                <a href="../quiz.html">
                    <h3>Quiz</h3>
                </a>
            </div>

            <div class="btn-logout">
                <a href="../index.html">
                <h3>Sair</h3>
                </a>
                
            </div>
        </div>

        <div class="dash">
            
            <div class="header-top">
                <div class="hello">
                    <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
                </div>
            </div>

            <div class="kpi-container">
                <div class="card-kpi">
                    <h3>Estilo mais alto do dia!</h3>
                    <p>Hoje o estilo <br>
                    <b id="kpi_estilo_alta">---</b> <br>
                    está em alta!</p>
                </div>

                <div class="card-kpi">
                    <h3>Sua Jornada</h3>
                    <p>No total o estilo <br>
                    <b id="kpi_total_descobertas">0</b> <br>
                    é o que você tem mais pontos!</p>
                </div>
            </div>

            <div class="graph-container">

                <div class="graph">
                    <h3 class="titulo-grafico">Preferências da Comunidade</h3>
                    <div class="canvas-container">
                        <canvas id="myChartPizza"></canvas>
                    </div>
                </div>

                <div class="graph">
                    <h3 class="titulo-grafico">Seu DNA Artístico</h3>
                    <div class="canvas-container">
                        <canvas id="myChartRadar"></canvas>
                    </div>
                </div>

            
            </div>

        </div>
    </div>

</body>

</html>

<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    /*
       Chama as funções que buscam seus dados específicos.
    */
    window.onload = function() {
        obterDadosRadar();
        obterDadosPizza();
        exibirKPIs();
    };

    // --- SEÇÃO DE KPIs ---
    function exibirKPIs() {
        var idUsuario = sessionStorage.ID_USUARIO;

        // KPI Sua Jornada 
    fetch(`/dash/jornada/${idUsuario}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos KPI Jornada: ${JSON.stringify(resposta)}`);
                    
                    if (resposta.vencedorJornada == 'Nenhum') {
                        kpi_total_descobertas.innerHTML = "_____";
                    } else {
                        kpi_total_descobertas.innerHTML = resposta.vencedorJornada;
                    }
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
        .catch(function (error) {
            console.error(`Erro KPI: ${error.message}`);
        });


        // KPI Estilo em Alta (Geral do Dia)
        fetch(`/dash/alta-hoje`, { cache: 'no-store' })
            .then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos KPI Alta: ${JSON.stringify(resposta)}`);
                    
                    if (resposta.estiloEmAlta == 'Nenhum') {
                        kpi_estilo_alta.innerHTML = "Sem votos";
                    } else {
                        kpi_estilo_alta.innerHTML = resposta.estiloEmAlta;
                    }
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
        .catch(function (error) {
            console.error(`Erro KPI: ${error.message}`);
        });
    }


    function obterDadosRadar() {
        var idUsuario = sessionStorage.ID_USUARIO;

        fetch(`/dash/ultima/${idUsuario}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos Radar: ${JSON.stringify(resposta)}`);
                    
                    // Validação para não quebrar o gráfico se for um usuário novo sem quiz
                    if (resposta && resposta.pontosRealismo !== undefined) {
                        plotarRadar(resposta);
                    } else {
                        console.log("Usuário ainda não possui quiz registrado.");
                    }
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
        .catch(function (error) {
            console.error(`Erro na obtenção dos dados gráfico: ${error.message}`);
        });
    }

    
    function plotarRadar(resposta) {
        const ctxRadar = document.getElementById('myChartRadar');

        let dadosRadar = {
            labels: ['Realismo', 'Mangá', 'Cartoon', 'Minimalismo', 'Urban Sketch'],
            datasets: [{
                label: 'Sua última tentativa no quiz',
                data: [
                    resposta.pontosRealismo || 0, 
                    resposta.pontosManga || 0, 
                    resposta.pontosCartoon || 0, 
                    resposta.pontosMinimalismo || 0, 
                    resposta.pontosUrbano || 0
                ],
                fill: true,
                backgroundColor: 'rgba(190, 168, 144, 0.7)',
                borderColor: 'rgb(190, 168, 144)',
                borderWidth: 1.5
            }]
        };

        new Chart(ctxRadar, {
            type: 'radar',
            data: dadosRadar,
            options: {
                maintainAspectRatio: false,
                scales: {
                    r: { 
                        angleLines: { color: 'white' },
                        grid: { color: 'rgba(255, 255, 255, 0.2)' },
                        pointLabels: { color: 'white', font: { size: 14 } },
                        ticks: { display: false },
                        suggestedMin: 0,
                        suggestedMax: 10
                    }
                },
                plugins: { legend: { labels: { color: 'white' } } }
            }
        });
    }


    // --- SEÇÃO DO GRÁFICO DE PIZZA (Preferências da Comunidade) ---

    function obterDadosPizza() {
        fetch(`/dash/comunidade`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos Pizza: ${JSON.stringify(resposta)}`);
                    plotarPizza(resposta);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
        .catch(function (error) {
            console.error(`Erro na obtenção dos dados gráfico: ${error.message}`);
        });
    }

    function plotarPizza(resposta) {
        const ctxPizza = document.getElementById('myChartPizza');

        // Converter os valores brutos que vieram do banco para números 
        let realismo = Number(resposta.GeralRealismo) || 0;
        let manga = Number(resposta.GeralManga) || 0;
        let cartoon = Number(resposta.GeralCartoon) || 0;
        let minimalismo = Number(resposta.GeralMinimalismo) || 0;
        let urbano = Number(resposta.GeralUrbano) || 0;

        let totalPontos = realismo + manga + cartoon + minimalismo + urbano;

       
        let dadosPizza = {
            labels: ['Realismo', 'Mangá', 'Cartoon', 'Minimalismo', 'Urban Sketch'],
            datasets: [{
                data: [realismo, manga, cartoon, minimalismo, urbano],
                backgroundColor: ['#737D7F', '#DAD6D7', '#BEA890', '#101112', '#A6ADB5'],
                borderColor: '#333',
                borderWidth: 1
            }]
        };

        new Chart(ctxPizza, {
            type: 'pie',
            data: dadosPizza,
            options: {
                plugins: {
                    legend: {
                        display: true,
                        position: 'top',
                        labels: { color: 'white', font: { size: 14 } }
                    },
                    tooltip: {
                        callbacks: {

                            //cálculo da porcentagem 
                            label: function(context) {
                                let valorBruto = context.raw || 0;
                                
                                let porcentagem = 0; 

                                if (totalPontos > 0) {
                                    porcentagem = ((valorBruto / totalPontos) * 100).toFixed(0);
                                } else {
                                    porcentagem = 0;
                                }
                                
                                // Retorna o nome do estilo e a porcentagem calculada 
                                return ` ${context.label}: ${porcentagem}%`;
                            }
                        }
                    }
                }
            }
        });
    }

   
</script>
